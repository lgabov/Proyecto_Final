<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Recursos Humanos</title>
    <link rel="stylesheet" href="styledashboard.css">
</head>
<body>

<header>
    <h1>Taller Node.js S.A. de C.V.</h1>
    <div>
        <span id="adminName">Admin</span>
        <button class="btn-danger" style="margin-left: 1rem;" onclick="logout()">Cerrar Sesión</button>
    </div>
</header>

<div class="container">
    <div class="actions-bar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar empleado por nombre...">
            <button class="btn-primary" onclick="buscarEmpleado()">Buscar</button>
        </div>
        <button class="btn-success" onclick="openModal()">+ Agregar Empleado</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Apellidos</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Dirección</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="employeeTableBody">
            <!-- Los datos se inyectan dinámicamente desde el JS -->
        </tbody>
    </table>
</div>

<!-- Modal para Agregar/Editar -->
<div id="employeeModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Nuevo Empleado</h2>
        <form id="employeeForm">
            <!-- Input oculto indispensable para no perder el password original al actualizar -->
            <input type="hidden" id="empPassword">

            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" id="empUsername" required>
            </div>
            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" id="empLastname" required>
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" id="empPhone" required>
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="empEmail" required>
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" id="empAddress" required>
            </div>
            <div class="form-group">
                <label>Rol / Puesto</label>
                <input type="text" id="empRol" required>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                <button type="button" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-success">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
